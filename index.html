<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Struggle Bus" />
    <meta name="theme-color" content="#808a94" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Struggle Bus</title>
    <!-- (before the boot script: the first paint's style comes after it, so it wins) -->
    <style>
      html, body { margin: 0; height: 100%; background: #808a94; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
    </style>
    <script>
      // The boot downloads start now, not after the game's script has loaded and run: the game
      // takes these responses over (bootFetch in src/world/City.ts), so nothing downloads twice.
      // The .bin files ask for low priority: the game's script comes first. far16.bin, the biggest, is handed out unstarted, and City.loadFar
      // starts it once far.bin and horizon.bin are in: nothing waits for it, and a low priority alone doesn't keep it off the bandwidth of
      // what the first frame needs (at 150 KB/s, started here, it put that frame seconds later). With the far field off nothing starts it.
      // __sbDataV is the data's version, on every URL under /city/ (dataQuery in City.ts): a re-bake keeps the file names
      // and vercel.json caches them, so a phone that played the old city would run the new game on it. Bump it in the same commit as
      // anything under public/city that follows a deploy, a re-bake or a relandmark.py run: on the old value that phone never sees it.
      (function () {
        try {
          var v = (window.__sbDataV = 'osm3');
          var q = new URLSearchParams(location.search).get('city');
          var city = q === null ? 'sf' : q; // as main.ts reads it (an empty ?city= stays empty)
          var base = './city/' + city;
          var get = function (f, pri) {
            var p = fetch(base + '/' + f + '?v=' + v, pri ? { priority: pri } : undefined);
            p.catch(function () {});
            return p;
          };
          window.__sbBoot = { base: base, manifest: get('city.json'), far: get('far.bin', 'low'), horizon: get('horizon.bin', 'low'), far16: function () { return get('far16.bin', 'low'); } };
          // The first paint (SKY.md 4): the page is the day's grey until the game's first frame, seconds away on a slow line, so at dusk and at night it takes the
          // sky's colour from the Sun's height over the city, by a small model (0.03 degrees at worst). Where the city is, before its city.json: ?lat=&lon=, else
          // its origin as its own city.json gave it on the last visit (any city's, kept by its folder), so a night load is the night's from its first paint; a first
          // visit waits for city.json, read off a copy as it lands. Once the game writes the sky's colour (LiveSky.page) this leaves the page to it.
          // Not with ?sky=off, which is today's page; ?t= is the live sky's moment, ?hour=blue its held hour.
          var qs = new URLSearchParams(location.search), t = qs.get('t');
          if (qs.get('sky') !== 'off') {
            var ms = t === null ? NaN : /^\d+$/.test(t) ? Number(t) : Date.parse(t);
            if (!isFinite(ms)) ms = Date.now();
            // (the Sun's height, deg, and its hour angle, h)
            var sun = function (t, a, o) { var r = Math.PI / 180, d = t / 864e5 - 10957.5, g = 357.53 + 0.9856 * d, l = (280.46 + 0.98565 * d + 1.915 * Math.sin(g * r)) * r, e = 0.4091, v = Math.asin(Math.sin(e) * Math.sin(l)), h = (280.46 + 360.98565 * d + o) * r - Math.atan2(Math.cos(e) * Math.sin(l), Math.cos(l)); a *= r; return [Math.asin(Math.sin(a) * Math.sin(v) + Math.cos(a) * Math.cos(v) * Math.cos(h)) / r, h / r / 15]; };
            // The colour the game gives the page (LiveSky.page): its live table's FOG 2 by day, SKY_LOW 3 once the bands draw half the sky or more, on the two chains of
            // tables, setting and rising, crossed by the hour angle as the light is (SkyTable.ts settingShare). P: rows of height (deg, falling) and colour, FOG 2 setting
            // and rising, then SKY_LOW 3 setting and rising; B: where the bands start and end, setting and rising. `node tools/sky/run.mjs firstpaint.ts --write` writes
            // them from the real tables, and without --write checks them against the game's.
            var P = [[21.7, '808a94', 20.85, '818894', 15.3, '85808d', 11.4, '887b84', 8, '87787b'], [15.75, '808a94', 8, '7a7989'], [15, 'b8acb8', 10.8, 'cdb7b9', 7, 'd8c5b9', 5.35, 'd4b4ab', 4.1, 'd1a7a6', 3.65, 'cfa2a4', 1.7, 'c390a5', 0.2, 'ae7ba2', -0.55, 'a171a1', -2.65, '76589f', -4.2, '50499a', -5, '394295'], [15, '949da7', 8.5, '9ca0b2', 1, 'aca3ba', -1.5, '8178ab', -5, '394295']], B = [16, 13, 10, 7];
            var sm = function (a, b, x) { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
            var at = function (k, e, n) { var i = 0; while (i + 2 < k.length && e < k[i + 2]) i += 2; var j = Math.min(i + 2, k.length - 2), u = j > i ? Math.min(1, Math.max(0, (k[i] - e) / (k[i] - k[j]))) : 0, a = parseInt(k[i + 1].substr(n, 2), 16); return a + (parseInt(k[j + 1].substr(n, 2), 16) - a) * u; };
            var col = (window.__sbBoot.sky = function (e, H) {
              H = (((H % 24) + 36) % 24) - 12;
              var w = H > 6 ? 1 - sm(10.5, 13.5, H) : H < -6 ? 1 - sm(10.5, 13.5, H + 24) : sm(-1.5, 1.5, H), r = sm(B[2], B[3], e), f = r + (sm(B[0], B[1], e) - r) * w >= 0.5 ? 2 : 0, c = '#';
              for (var n = 0; n < 6; n += 2) c += ('0' + Math.round(at(P[f + 1], e, n) + (at(P[f], e, n) - at(P[f + 1], e, n)) * w).toString(16)).slice(-2);
              return c;
            });
            var blue = qs.get('hour') === 'blue', st = null;
            var paint = function (lat, lon) {
              if (window.__sbPage) return;
              // (?hour=blue: its held hour's -6 degrees)
              var s = blue ? [-6, 12] : sun(ms, lat, lon), c = col(s[0], s[1]);
              // (by day the page's own grey stands; after a wrong guess it's painted back)
              if (c === '#808a94' && !st) return;
              if (!st) document.head.appendChild((st = document.createElement('style')));
              st.textContent = 'html, body { background: ' + c + '; }';
              var tc = document.querySelector('meta[name=theme-color]');
              if (tc) tc.setAttribute('content', c);
            };
            var key = 'strugglebus.origin.v1:' + city, la = Number(qs.get('lat')), lo = Number(qs.get('lon')), was = null;
            try {
              was = JSON.parse(localStorage.getItem(key) || 'null');
            } catch (e) {}
            if (qs.has('lat') && qs.has('lon') && isFinite(la) && isFinite(lo)) paint(la, lo);
            else if (was && isFinite(was[0]) && isFinite(was[1])) paint(was[0], was[1]);
            else if (blue) paint(0, 0);
            window.__sbBoot.manifest.then(function (r) { return r.clone().json(); }).then(function (m) {
              try {
                localStorage.setItem(key, JSON.stringify([m.origin[0], m.origin[1]]));
              } catch (e) {}
              paint(m.origin[0], m.origin[1]);
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

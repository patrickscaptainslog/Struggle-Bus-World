<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Struggle Bus" />
    <meta name="theme-color" content="#808a94" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Struggle Bus</title>
    <script>
      // The boot downloads start now, not after the game's script has loaded and run: the game
      // takes these responses over (bootFetch in src/world/City.ts), so nothing downloads twice.
      // The .bin files ask for low priority: the game's script comes first. far16.bin, the biggest, is handed out unstarted, and City.loadFar
      // starts it once far.bin and horizon.bin are in: nothing waits for it, and a low priority alone doesn't keep it off the bandwidth of
      // what the first frame needs (at 150 KB/s, started here, it put that frame seconds later). With the far field off nothing starts it.
      // __sbDataV is the data's version, on every URL under /city/ (dataQuery in City.ts): a re-bake keeps the file names
      // and vercel.json caches them, so a phone that played the old city would run the new game on it. Bump it in the same commit as
      // anything under public/city that follows a deploy, a re-bake or a relandmark.py run: on the old value that phone never sees it.
      (function () {
        try {
          var v = (window.__sbDataV = 'osm2');
          // (?moon is black from the first paint, Safari's bars with it: no fog-grey before a black sky)
          // (?moonland: black too, and nothing to wait for: the flight is up first)
          if (new URLSearchParams(location.search).has('moonland')) document.documentElement.className = 'moon in';
          if (new URLSearchParams(location.search).has('moon')) {
            document.documentElement.className = 'moon';
            document.documentElement.dataset.wait = (new URLSearchParams(location.search).get('site') || 'the moon').toUpperCase();
            document.querySelector('meta[name=theme-color]').content = '#000000';
          }
          if (new URLSearchParams(location.search).has('moonrun') || new URLSearchParams(location.search).has('moon') || new URLSearchParams(location.search).has('moonland')) return; // (no city in those: src/sky/moonrun.ts, src/moon/)
          var q = new URLSearchParams(location.search).get('city');
          var city = q === null ? 'sf' : q; // as main.ts reads it (an empty ?city= stays empty)
          var base = './city/' + city;
          var get = function (f, pri) {
            var p = fetch(base + '/' + f + '?v=' + v, pri ? { priority: pri } : undefined);
            p.catch(function () {});
            return p;
          };
          window.__sbBoot = { base: base, manifest: get('city.json'), far: get('far.bin', 'low'), horizon: get('horizon.bin', 'low'), far16: function () { return get('far16.bin', 'low'); } };
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #808a94; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
      /* ?moon: a line of text on black until the ground near the bus is in (main.ts adds .in), then the picture comes up out of the black */
      html.moon, html.moon body { background: #000; }
      html.moon:not(.in) body::after { content: attr(data-wait); position: fixed; left: 0; right: 0; top: 46%; text-align: center; font: 12px ui-monospace, Menlo, monospace; letter-spacing: 0.4em; color: #747882; }
      html.moon canvas#game { transition: opacity 0.6s; }
      html.moon:not(.in) canvas#game { opacity: 0; }
      html.moon:not(.in) body > div { visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html><html><body><script type="module">
import { makeReverbIR, makeNoise } from '../src/audio/dsp.ts';
const SR = 48000, SEC = 20;
async function run(name, build) {
  const ctx = new OfflineAudioContext(2, SR * SEC, SR);
  build(ctx);
  const t = performance.now();
  await ctx.startRendering();
  return [name, Math.round(performance.now() - t)];
}
const out = [];
out.push(await run('empty', (c) => { const o = c.createOscillator(); o.connect(c.destination); o.start(); }));
out.push(await run('convolver 2.6s', (c) => { const o = c.createOscillator(); const v = c.createConvolver(); v.normalize = false; v.buffer = makeReverbIR(c, 2.6, 2.1, 1); o.connect(v).connect(c.destination); o.start(); }));
out.push(await run('convolver 1.6s', (c) => { const o = c.createOscillator(); const v = c.createConvolver(); v.normalize = false; v.buffer = makeReverbIR(c, 1.6, 1.4, 1); o.connect(v).connect(c.destination); o.start(); }));
out.push(await run('20 oscillators', (c) => { for (let i = 0; i < 20; i++) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 100 + i * 37; o.connect(c.destination); o.start(); } }));
out.push(await run('20 biquads', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createBiquadFilter(); f.frequency.value = 500; n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('20 biquads automated', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createBiquadFilter(); f.frequency.setValueAtTime(300, 0); f.frequency.setTargetAtTime(3000, 0, 5); n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('20 biquads auto k-rate', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createBiquadFilter(); f.frequency.automationRate = 'k-rate'; f.Q.automationRate = 'k-rate'; f.frequency.setValueAtTime(300, 0); f.frequency.setTargetAtTime(3000, 0, 5); n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('20 biquads stepped 30Hz', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createBiquadFilter(); for (let k = 0; k < 600; k++) f.frequency.setValueAtTime(300 + k * 4, k / 30); n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('16 idle panners', (c) => { const o = c.createOscillator(); o.start(); o.connect(c.destination); for (let i = 0; i < 16; i++) { const p = c.createStereoPanner(); p.connect(c.destination); } }));
out.push(await run('convolver 2.0s', (c) => { const o = c.createOscillator(); const v = c.createConvolver(); v.normalize = false; v.buffer = makeReverbIR(c, 2.0, 1.9, 1); o.connect(v).connect(c.destination); o.start(); }));
out.push(await run('20 gains', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createGain(); n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('20 stereo panners', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 20; i++) { const f = c.createStereoPanner(); f.pan.value = 0.3; n.connect(f); n = f; } n.connect(c.destination); }));
out.push(await run('6 delays (4 in fdn)', (c) => { const o = c.createOscillator(); o.start(); for (let i = 0; i < 6; i++) { const d = c.createDelay(1); d.delayTime.value = 0.2 + i * 0.03; const g = c.createGain(); g.gain.value = 0.5; o.connect(d).connect(g).connect(d); g.connect(c.destination); } }));
out.push(await run('2 modulated delays', (c) => { const o = c.createOscillator(); o.start(); for (let i = 0; i < 2; i++) { const d = c.createDelay(0.05); d.delayTime.value = 0.012; const l = c.createOscillator(); l.frequency.value = 0.3; const g = c.createGain(); g.gain.value = 0.002; l.connect(g).connect(d.delayTime); l.start(); o.connect(d).connect(c.destination); } }));
out.push(await run('compressor', (c) => { const o = c.createOscillator(); o.start(); const k = c.createDynamicsCompressor(); o.connect(k).connect(c.destination); }));
out.push(await run('3 waveshapers', (c) => { let n = c.createOscillator(); n.start(); for (let i = 0; i < 3; i++) { const w = c.createWaveShaper(); w.curve = new Float32Array([-1, 0, 1]); n.connect(w); n = w; } n.connect(c.destination); }));
out.push(await run('3 noise loops', (c) => { const b = makeNoise(c, 3, 1, false); for (let i = 0; i < 3; i++) { const s = c.createBufferSource(); s.buffer = b; s.loop = true; s.connect(c.destination); s.start(); } }));
window.__cost = out; window.__shotReady = true;
</script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Struggle Bus — sound bench</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #808a94; --ink: #0b0e13; --panel: #0f131a; --line: #202732; --text: #fffbe8; --dim: #bbc1c6;
        --h0: #e0405e; --h1: #f58233; --h2: #f8b52c; --h3: #3cb84f; --h4: #3a96f0; --h5: #9a56e8;
        --h0d: #7a1d4c; --h1d: #a8333e; --h2d: #d25a3a; --h3d: #12614e; --h4d: #1f45a8; --h5d: #522496;
        --bus: #fbbf24; --busd: #a0412e; --grey: #6f7882; --greyd: #2e3843;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; -webkit-text-size-adjust: 100%; }
      body { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 22px; letter-spacing: 2px; margin: 0 0 2px; color: var(--ink); text-transform: uppercase; }
      h1 span { color: var(--bus); text-shadow: 2px 2px 0 var(--busd), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); }
      .sub { color: var(--greyd); margin: 0 0 14px; }
      .card { background: var(--panel); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--greyd); padding: 12px; margin-bottom: 14px; }
      .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
      button { font: inherit; font-weight: 700; letter-spacing: 1px; color: var(--ink); border: 2px solid var(--ink); border-radius: 0; padding: 14px 10px; min-height: 56px; cursor: pointer; text-transform: uppercase; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      button:active { transform: translate(2px, 2px); box-shadow: none !important; }
      #start { width: 100%; min-height: 72px; font-size: 18px; background: var(--bus); box-shadow: 4px 4px 0 var(--busd); margin-bottom: 14px; }
      #start.on { background: var(--h3); box-shadow: 4px 4px 0 var(--h3d); }
      #pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      #pads .big { grid-column: 1 / -1; min-height: 96px; font-size: 26px; letter-spacing: 4px; }
      #pads .wide { grid-column: span 2; }
      .h0 { background: var(--h0); box-shadow: 4px 4px 0 var(--h0d); } .h1 { background: var(--h1); box-shadow: 4px 4px 0 var(--h1d); }
      .h2 { background: var(--h2); box-shadow: 4px 4px 0 var(--h2d); } .h3 { background: var(--h3); box-shadow: 4px 4px 0 var(--h3d); }
      .h4 { background: var(--h4); box-shadow: 4px 4px 0 var(--h4d); } .h5 { background: var(--h5); box-shadow: 4px 4px 0 var(--h5d); color: var(--text); }
      .grey { background: var(--grey); box-shadow: 4px 4px 0 var(--greyd); color: var(--text); }
      .row { display: grid; grid-template-columns: 96px 1fr 48px; gap: 10px; align-items: center; padding: 6px 0; }
      .row span { color: var(--dim); } .row b { text-align: right; font-weight: 400; }
      input[type=range] { width: 100%; height: 32px; accent-color: var(--bus); }
      #live { color: var(--dim); margin-top: 8px; min-height: 1.4em; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
      .bar button { min-height: 44px; padding: 8px 14px; }
      #status { color: var(--dim); align-self: center; }
      #viz { width: 100%; display: block; image-rendering: pixelated; background: var(--ink); }
      #report { white-space: pre-wrap; word-break: break-word; color: var(--dim); font-size: 11px; max-height: 360px; overflow: auto; margin: 10px 0 0; }
      @media (min-width: 820px) { .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; } }
    </style>
  </head>
  <body>
    <h1><span>Struggle Bus</span> sound bench</h1>
    <p class="sub">every sound is synthesized · tap to listen · the offline render goes through the same graph</p>
    <button id="start">tap to start audio</button>
    <div class="cols">
      <div class="card">
        <h2>pads</h2>
        <div id="pads"></div>
      </div>
      <div class="card">
        <h2>flight</h2>
        <div id="sliders"></div>
        <div id="live"></div>
      </div>
    </div>
    <div class="card">
      <h2>offline 20 s session</h2>
      <div class="bar">
        <button id="render" class="h4">render + analyse</button>
        <button id="play" class="h3">play render</button>
        <button id="stems" class="h5">stems</button>
        <span id="status">—</span>
      </div>
      <canvas id="viz"></canvas>
      <pre id="report"></pre>
    </div>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
